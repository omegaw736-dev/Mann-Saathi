function reset(){ S.age=null; S.stressor=null; S.step="lang"; S.q=0; S.answers=[]; S.follow=null; S.run++; }

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  const a = attrs || {};
  for(const k in a){
    if(k==="class") e.className = a[k];
    else if(k==="onclick") e.onclick = a[k];
    else e.setAttribute(k, a[k]);
  }
  kids.flat().forEach(c=>{
    if(c===null || c===undefined || c===false) return;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}
function row(label, fn){ return el("button",{class:"row",type:"button",onclick:fn}, el("span",{},label)); }
function ansRow(label, v, fn){
  const bars = el("span",{class:"lvl","aria-hidden":"true"}, [1,2,3].map(n=>el("i",{class:n<=v?"on":""})));
  return el("button",{class:"row",type:"button",onclick:fn}, el("span",{},label), bars);
}
function tile(icon, label, fn){ return el("button",{class:"tile",type:"button",onclick:fn}, el("span",{class:"ico","aria-hidden":"true"},icon), el("span",{},label)); }
function linkBtn(label, fn){ return el("button",{class:"link",type:"button",onclick:fn},label); }
function restartLink(){ return el("div",{class:"nav"}, linkBtn(t().restart,()=>{reset();render();})); }

/* ---- the sun: progress through the check-in ---- */
function progress(){
  switch(S.step){
    case "lang": return 0;
    case "age": return .08;
    case "stressor": return .16;
    case "intro": return .24;
    case "quiz": return .24 + (S.q/7)*.62;
    case "follow": return .9;
    default: return 1;
  }
}
function setSky(){
  const p = progress();
  const u = p*0.5;                                        // first half of the arc: horizon to the top
  const x = (1-u)*(1-u)*24 + 2*(1-u)*u*180 + u*u*336;
  const y = (1-u)*(1-u)*98 + 2*(1-u)*u*(-46) + u*u*98;
  $("#sun").style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  document.documentElement.style.setProperty("--day", p.toFixed(2));
}

function renderSOS(){
  const x=$("#sos"); x.replaceChildren();
  x.append(el("span",{},t().sosline),
    el("a",{href:"tel:112"},"112"),
    el("a",{href:"tel:14416"},"Tele-MANAS 14416"));
}

function render(){
  document.documentElement.lang = S.lang==="hi" ? "hi" : "en";
  document.body.classList.toggle("large", S.age==="a60");
  $("#tag").textContent = t().tag;
  setSky();
  renderSOS();
  app.replaceChildren();
  window.scrollTo({top:0});
  ({lang:vLang, age:vAge, stressor:vStr, intro:vIntro, quiz:vQuiz, follow:vFollow, result:vResult})[S.step]();
}

function vQuiz(){

    el("div",{class:"count"}, X.qn(i+1)),

  app.append(list);

/* ============ SCORING (same for every age band) ============ */
function evaluate(){
  const score = S.answers.reduce((a,b)=>a+(b||0),0);   // 0 - 21
  const selfHarm = S.answers[6]>0;                      // any answer other than "Not at all"
  let level="green";
  if(selfHarm || score>=13) level="red";
  else if(score>=7) level="amber";
  return {score, selfHarm, level};
}

const BAD = /(you (have|are suffering from|suffer from) (depression|anxiety|a disorder|bipolar)|\b(take|taking) (a |some |the )?(medicine|medication|tablets?|pills?)|antidepressant|\b\d+\s?mg\b|(आपको|तुम्हें) (डिप्रेशन|अवसाद|एंग्जाइटी) है|दवा लें|दवाई लें|गोली)/i;
function numbersOK(txt){
  const ok=new Set(["112","14416","1098","18008914416","08046110007","9152987821"]);
  const long = txt.match(/\+?\d[\d\s-]{5,}\d/g) || [];
  for(const m of long){ if(!ok.has(m.replace(/\D/g,""))) return false; }
  const short = txt.replace(/\+?\d[\d\s-]{5,}\d/g," ").match(/\b\d{3,5}\b/g) || [];
  for(const d of short){ if(!ok.has(d)) return false; }
  return true;
}

async function askGemini(level, score, selfHarm){
  if(!GEMINI_API_KEY || GEMINI_API_KEY==="YOUR_KEY_HERE") throw new Error("no key");
  const E=T.en;
  const ageL=E.ages[S.age];
  const strL=E.strs[S.stressor||"other"];
  const fol=(S.follow!==null && S.stressor) ? E.follow[S.stressor].o[S.follow] : "none given";
  const ageRule = S.age==="u18" ? "Speak kindly to a young person and suggest talking to a trusted adult."
                : S.age==="a60" ? "Use very simple, short sentences."
                : "Use plain, warm language.";
  const prompt = `You are the gentle writing voice of "Mann Saathi", a mental health screening guide in India.
Write in ${S.lang==="hi" ? "simple Hindi (Devanagari script)" : "simple English"}.
Person: age band ${ageL}; main thing weighing on them: ${strL}; detail they chose: ${fol}.
Screening result: ${level.toUpperCase()} (score ${score} of 21)${selfHarm ? "; they indicated thoughts of self-harm" : ""}.
Return ONLY JSON: {"explanation":"...","steps":["...","...","..."]}
Rules:
- explanation: exactly 3 short, warm sentences. For amber or red, say that their answers suggest they may benefit from talking to a professional. Never say the person has any condition. Never diagnose.
- steps: exactly 3 small, concrete self-care steps that fit the age band and what is weighing on them. No medication, no supplements, no dosages.
- If they indicated self-harm thoughts: be gentle, say they are not alone, and mention Tele-MANAS 14416 (free, 24x7) or 112 if in immediate danger. Give no method details.
- ${ageRule}
- Use only phone numbers from the RESOURCE NOTES below. Never invent numbers or organisations.

${RESOURCE_NOTES}`;
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),20000);
  try{
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`,{
      method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],
        generationConfig:{temperature:0.4,responseMimeType:"application/json",thinkingConfig:{thinkingBudget:0}}})
    });
    if(!r.ok) throw new Error("http "+r.status);
    const d = await r.json();
    let txt = d.candidates[0].content.parts.map(p=>p.text||"").join("");
    txt = txt.replace(/^```json|```$/g,"").trim();
    const j = JSON.parse(txt);
    const explanation = String(j.explanation||"").trim();
    const steps = (Array.isArray(j.steps)?j.steps:[]).map(s=>String(s).trim()).filter(Boolean).slice(0,3);
    if(!explanation || steps.length<2) throw new Error("bad shape");
    const all = explanation+" "+steps.join(" ");
    if(BAD.test(all) || !numbersOK(all)) throw new Error("filtered");
    return {explanation, steps};
  } finally { clearTimeout(to); }
}

/* ============ RESULT ============ */
function vResult(){
  const X=t();
  const {score,selfHarm,level}=evaluate();
  const under18 = S.age==="u18";
  const runId = S.run;
  const red = selfHarm || level==="red";
  const shown = red ? "red" : level;

  const verdict = el("div",{class:"verdict "+shown[0]}, el("h2",{},X.levels[shown]),
    el("div",{class:"meter","aria-hidden":"true"},
      ["green","amber","red"].map(n=>el("i",{class:n===shown?"on":""}))));
  const loadingNode = el("div",{}, el("div",{class:"skel"}), el("div",{class:"skel"}), el("div",{class:"skel"}));
  const expBox = el("div",{}, el("h3",{},X.exp_h), loadingNode);
  const stepsUl = el("ul",{class:"steps"});
  const stepsBox = el("div",{class:"hide"}, el("h3",{},X.steps_h), stepsUl);
  const resBox = el("div",{}, el("h3",{},X.res_h), ...resList(level,selfHarm,under18).map(resCard));
  const adultBox = under18 ? el("div",{}, el("h3",{},X.adult_h), el("p",{},X.adult)) : null;

  app.append(verdict);
  if(selfHarm) app.append(el("p",{class:"sh"},X.selfharm_banner));
  if(red) app.append(resBox, expBox, stepsBox, adultBox);
  else app.append(expBox, stepsBox, resBox, adultBox);
  app.append(el("div",{class:"disc"},X.disc), el("p",{class:"note"},X.checked()), restartLink());

  const fb = ()=>({explanation:X.fb_exp[shown], steps:X.fb_steps[S.stressor||"other"]});
  const show=(r,std)=>{
    if(S.run!==runId || S.step!=="result") return;
    loadingNode.replaceWith(el("p",{},r.explanation));
    r.steps.forEach(s=>stepsUl.append(el("li",{},s)));
    stepsBox.classList.remove("hide");
    if(std) expBox.append(el("p",{class:"note"},X.std_note));
  };
  askGemini(shown, score, selfHarm).then(r=>show(r,false)).catch(()=>show(fb(),true));
}
